<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<title>Touch Grass</title>
<meta name="description" content="A dreamy, interactive 3D meadow. Brush your cursor through the grass." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:opsz,wght@6..12,500;6..12,600&display=swap" rel="stylesheet" />
<style>
  :root {
    --glass: rgba(44, 30, 72, 0.38);
    --glass-border: rgba(255, 255, 255, 0.16);
    --ink: #2a2140;
    --muted: rgba(236, 230, 248, 0.70);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: #120e22;
    cursor: none;
    -webkit-tap-highlight-color: transparent;
    user-select: none; -webkit-user-select: none;
    overscroll-behavior: none;
  }
  canvas#scene {
    position: fixed; inset: 0; width: 100vw; height: 100vh; display: block;
    touch-action: none; cursor: none;
  }

  /* ---------- time-of-day toggle ---------- */
  .toggle {
    position: fixed; top: max(22px, env(safe-area-inset-top)); left: 50%;
    transform: translateX(-50%);
    display: flex; gap: 2px; padding: 5px;
    border-radius: 999px;
    background: var(--glass);
    -webkit-backdrop-filter: blur(18px) saturate(150%);
    backdrop-filter: blur(18px) saturate(150%);
    border: 1px solid var(--glass-border);
    box-shadow: 0 10px 34px rgba(18, 8, 40, 0.28), inset 0 1px 0 rgba(255,255,255,0.08);
    z-index: 10;
    transition: opacity .6s ease, transform .6s ease;
  }
  .toggle.hidden { opacity: 0; pointer-events: none; transform: translateX(-50%) translateY(-12px); }
  .toggle .indicator {
    position: absolute; top: 5px; bottom: 5px; left: 0; width: 0;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.95);
    box-shadow: 0 2px 12px rgba(20, 10, 40, 0.18);
    transition: transform .6s cubic-bezier(.65,0,.25,1), width .6s cubic-bezier(.65,0,.25,1);
    will-change: transform, width;
  }
  .toggle button {
    position: relative; z-index: 1;
    display: flex; align-items: center; gap: 8px;
    padding: 10px 18px 10px 15px;
    border: 0; background: none; border-radius: 999px;
    font: 600 14px/1 "Nunito Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    letter-spacing: 0.015em;
    color: var(--muted);
    cursor: none; outline: none;
    transition: color .45s ease;
  }
  .toggle button:hover { color: rgba(255,255,255,0.92); }
  .toggle button.active { color: var(--ink); }
  .toggle button:focus-visible { box-shadow: 0 0 0 2px rgba(255,255,255,0.55); }
  .toggle svg { width: 17px; height: 17px; flex: none; }
  @media (max-width: 520px) {
    .toggle button { padding: 9px 12px 9px 10px; font-size: 13px; gap: 6px; }
    .toggle svg { width: 15px; height: 15px; }
  }

  /* ---------- hand cursor ---------- */
  #hand {
    position: fixed; left: 0; top: 0; width: 58px; height: 58px;
    pointer-events: none; z-index: 20;
    opacity: 0; transition: opacity .25s ease;
    filter: drop-shadow(0 5px 7px rgba(16, 8, 36, 0.34));
    will-change: transform;
  }
  #hand.visible { opacity: 1; }
  #hand svg { width: 100%; height: 100%; display: block; overflow: visible; }

  /* ---------- fade-in veil ---------- */
  #veil {
    position: fixed; inset: 0; background: #120e22; z-index: 30;
    pointer-events: none; transition: opacity 2.2s ease;
  }
  #veil.gone { opacity: 0; }
  #nogl {
    position: fixed; inset: 0; display: none; place-items: center; z-index: 40;
    color: #e9e2f7; font: 500 16px/1.5 "Nunito Sans", system-ui, sans-serif; text-align: center; padding: 24px;
  }
</style>
<script type="importmap">
{
  "imports": {

<div id="hand" aria-hidden="true">
  <svg viewBox="0 0 64 64">
    <defs>
      <g id="handShape">
        <rect x="17" y="27" width="34" height="28" rx="12.5"/>
        <rect x="18.6" y="10.5" width="9" height="27" rx="4.5" transform="rotate(-7 23 37)"/>
        <rect x="27.4" y="6.5" width="9" height="30" rx="4.5"/>
        <rect x="36" y="8.5" width="9" height="28" rx="4.5" transform="rotate(5 40.5 36)"/>
        <rect x="43.4" y="15.5" width="8.4" height="22" rx="4.2" transform="rotate(14 47.6 37)"/>
        <rect x="9" y="30" width="9" height="21" rx="4.5" transform="rotate(-42 15 47)"/>
      </g>

    <use href="#handShape" fill="#3a2d5c" stroke="#3a2d5c" stroke-width="4.6" stroke-linejoin="round"/>
    <use href="#handShape" fill="#ffffff"/>
    <path d="M27.6 18.5v9.5M36.4 18.5v9.5M44 22.5l-1.4 7.5" stroke="#3a2d5c" stroke-width="1.7" stroke-linecap="round" fill="none" opacity=".55"/>
    <path d="M24 46.5c3.5 3.2 11 4 16.5 0.4" stroke="#3a2d5c" stroke-width="1.6" stroke-linecap="round" fill="none" opacity=".35"/>
    <ellipse cx="34" cy="40" rx="7" ry="4.8" fill="#ffd6e4" opacity=".55"/>
    <path d="M30 9.5c0.8-0.6 2-0.8 3-0.6" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" fill="none" opacity=".9"/>
  </svg>
</div>

<div id="veil"></div>
<div id="nogl">This meadow needs WebGL to bloom.<br/>Try a recent desktop or mobile browser.</div>

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

/* =====================================================================
   Quality profile
   ===================================================================== */
const params = new URLSearchParams(location.search);
const IS_MOBILE = matchMedia('(pointer: coarse)').matches || Math.min(innerWidth, innerHeight) < 560;
const Q = IS_MOBILE
  ? { blades: 70000, maxPR: 1.5, msaa: 2, fireflies: 55, sparkles: 260, simRes: 256 }
  : { blades: 230000, maxPR: 2.0, msaa: 4, fireflies: 110, sparkles: 650, simRes: 512 };
if (params.has('blades')) Q.blades = +params.get('blades');

/* =====================================================================
   Helpers
   ===================================================================== */
const TAU = Math.PI * 2;
const lerp = (a, b, t) => a + (b - a) * t;
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const rand = mulberry32(20240611);
const gauss = () => { let u = 0, v = 0; while (!u) u = rand(); while (!v) v = rand(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(TAU * v); };

/* =====================================================================
   World layout
   ===================================================================== */
const CAM_Z = 6;
const HILL_Z = -30;
const TREE_Z = -30;

function heightAt(x, z) {
  const dz = z - HILL_Z;
  let h = 7.0 * Math.exp(-(x * x) / (2 * 21 * 21) - (dz * dz) / (2 * 13.5 * 13.5));
  h += 0.32 * Math.sin(x * 0.17 + 1.3) * Math.cos(z * 0.13 + 0.4);
  h += 0.18 * Math.sin(x * 0.41 + z * 0.23);
  // layered distant hills
  h += 4.6 * Math.exp(-((x + 50) ** 2) / (2 * 19 * 19) - ((z + 72) ** 2) / (2 * 17 * 17));
  h += 5.8 * Math.exp(-((x - 58) ** 2) / (2 * 23 * 23) - ((z + 84) ** 2) / (2 * 19 * 19));
  h += 3.2 * Math.exp(-((x - 4) ** 2) / (2 * 70 * 70) - ((z + 140) ** 2) / (2 * 24 * 24));
  h += 6.5 * Math.exp(-((x + 110) ** 2) / (2 * 40 * 40) - ((z + 170) ** 2) / (2 * 30 * 30));
  return h;
}

/* =====================================================================
   Renderer / camera
   ===================================================================== */
const canvas = document.getElementById('scene');
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ canvas, antialias: false, alpha: false, powerPreference: 'high-performance', stencil: false });
} catch (e) {
  document.getElementById('nogl').style.display = 'grid';
  throw e;
}
const isWebGL2 = renderer.capabilities.isWebGL2;
if (!isWebGL2) Q.msaa = 0;
renderer.toneMapping = THREE.NoToneMapping;
renderer.setClearColor(0x120e22, 1);

let pixelRatio = Math.min(window.devicePixelRatio || 1, Q.maxPR);
renderer.setPixelRatio(pixelRatio);
renderer.setSize(innerWidth, innerHeight, false);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.05, 2500);
const CAM_BASE = new THREE.Vector3(0, heightAt(0, CAM_Z) + 1.5, CAM_Z);
const LOOK_BASE = new THREE.Vector3(0, 4.4, HILL_Z);
function fovFor(aspect) { return aspect < 1 ? lerp(62, 48, clamp(aspect, 0.45, 1) * 1.8 - 0.8) : (aspect < 1.4 ? 48 : 42); }
camera.fov = fovFor(camera.aspect);
camera.position.copy(CAM_BASE);
camera.lookAt(LOOK_BASE);
camera.updateProjectionMatrix();

/* =====================================================================
   Shared uniforms (presets drive these)
   ===================================================================== */
const C = (hex, k = 1) => new THREE.Color(hex).multiplyScalar(k);
const U = {
  uTime: { value: 0 },
  uSunDir: { value: new THREE.Vector3(0, 0.3, -1).normalize() },
  uZenith: { value: C('#000') }, uSkyMid: { value: C('#000') }, uHorizon: { value: C('#000') },
  uSunGlow: { value: C('#000') },
  uLightColor: { value: C('#000') }, uAmbSky: { value: C('#000') }, uAmbGround: { value: C('#000') },
  uFogDensity: { value: 0.012 }, uMist: { value: 0 },
  uGrassBase: { value: C('#000') }, uGrassMid: { value: C('#000') }, uGrassMid2: { value: C('#000') }, uGrassTip: { value: C('#000') },
  uTrans: { value: C('#000') }, uSheen: { value: C('#000') }, uGlowColor: { value: C('#7dffd0', 2.4) },
  uFlowerGlow: { value: 0 },
  uTreeShadow: { value: C('#000') }, uTreeLit: { value: C('#000') }, uTrunk: { value: C('#000') }, uRim: { value: C('#000') },
  uCloudLit: { value: C('#000') }, uCloudShadow: { value: C('#000') }, uCloudOpacity: { value: 0.8 }, uCloudCover: { value: 0.45 },
  uDisc: { value: C('#000') }, uHalo: { value: C('#000') }, uDiscSize: { value: 0.05 }, uMoonness: { value: 1 },
  uStars: { value: 1 }, uFireflies: { value: 1 },
  uWind: { value: 1 },
  uDisp: { value: null }, uGlowTex: { value: null },
  uSimBounds: { value: new THREE.Vector4(-34, CAM_Z - 52, 68, 54) },
  uDensity: { value: 1 }, uWidthComp: { value: 1 },
  uProjScale: { value: 800 },
};

/* =====================================================================
   GLSL chunks
   ===================================================================== */
const GLSL_NOISE = /* glsl */`
float hash12(vec2 p){ vec3 p3 = fract(vec3(p.xyx) * .1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }
float hash13(vec3 p3){ p3 = fract(p3 * .1031); p3 += dot(p3, p3.zyx + 31.32); return fract((p3.x + p3.y) * p3.z); }
float vnoise(vec2 p){
  vec2 i = floor(p), f = fract(p); vec2 u = f * f * (3. - 2. * f);
  return mix(mix(hash12(i), hash12(i + vec2(1,0)), u.x), mix(hash12(i + vec2(0,1)), hash12(i + vec2(1,1)), u.x), u.y);
}
float vnoise3(vec3 p){
  vec3 i = floor(p), f = fract(p); vec3 u = f * f * (3. - 2. * f);
  float a = mix(mix(hash13(i), hash13(i+vec3(1,0,0)), u.x), mix(hash13(i+vec3(0,1,0)), hash13(i+vec3(1,1,0)), u.x), u.y);
  float b = mix(mix(hash13(i+vec3(0,0,1)), hash13(i+vec3(1,0,1)), u.x), mix(hash13(i+vec3(0,1,1)), hash13(i+vec3(1,1,1)), u.x), u.y);
  return mix(a, b, u.z);
}
float fbm(vec2 p){ float a = .5, s = 0.; for (int i = 0; i < 5; i++){ s += a * vnoise(p); p = p * 2.03 + vec2(1.7, 9.2); a *= .5; } return s; }
`;

const GLSL_ATMOS = /* glsl */`
uniform float uTime;
uniform vec3 uSunDir, uZenith, uSkyMid, uHorizon, uSunGlow;
uniform float uFogDensity, uMist;
vec3 skyColor(vec3 dir){
  float e = dir.y;
  vec3 c = mix(uHorizon, uSkyMid, smoothstep(-0.02, 0.30, e));
  c = mix(c, uZenith, smoothstep(0.22, 0.95, e));
  float sd = max(dot(dir, uSunDir), 0.0);
  c += uSunGlow * (pow(sd, 5.0) * 0.38 + pow(sd, 40.0) * 0.55);
  vec2 a = normalize(dir.xz + 1e-5), b = normalize(uSunDir.xz + 1e-5);
  c += uSunGlow * exp(-abs(e) * 7.0) * pow(max(dot(a, b), 0.0), 3.0) * 0.28;
  return c;
}
vec3 applyFog(vec3 col, vec3 wpos){
  vec3 v = wpos - cameraPosition; float d = length(v); vec3 dir = v / d;
  float f = 1.0 - exp(-pow(d * uFogDensity, 1.55));
  float mist = uMist * exp(-max(wpos.y - 0.2, 0.0) * 0.42) * smoothstep(2.0, 30.0, d);
  f = clamp(f + mist * (1.0 - f), 0.0, 1.0);
  vec3 fc = skyColor(normalize(vec3(dir.x, 0.015 + max(dir.y, 0.0) * 0.25, dir.z)));
  return mix(col, fc, f);
}
`;

const GLSL_FIELD = /* glsl */`
uniform float uWind;
uniform sampler2D uDisp, uGlowTex;
uniform vec4 uSimBounds;
vec2 windBend(vec2 xz, float rnd, out float wave){
  vec2 wd = normalize(vec2(1.0, 0.28));
  float t = uTime;
  float n1 = vnoise(xz * 0.055 - wd * t * 0.30);
  float n2 = vnoise(xz * 0.19 - wd * t * 0.85 + 13.7);
  wave = 0.5 + 0.5 * sin(dot(xz, wd) * 0.42 - t * 1.45 + n1 * 4.0);
  float gust = smoothstep(0.25, 0.85, n1);
  float s = (0.08 + 0.30 * wave * (0.35 + 0.65 * gust) + 0.16 * n2) * uWind;
  vec2 b = wd * s;
  b += vec2(sin(t * 2.1 + rnd * 43.0), cos(t * 1.7 + rnd * 31.0)) * 0.03 * uWind;
  wave *= gust;
  return b;
}
void sampleSim(vec2 xz, out vec4 sim, out float glow){
  vec2 suv = (xz - uSimBounds.xy) / uSimBounds.zw;
  float inside = step(0.0, suv.x) * step(suv.x, 1.0) * step(0.0, suv.y) * step(suv.y, 1.0);
  sim = texture2D(uDisp, suv) * inside;
  glow = texture2D(uGlowTex, suv).r * inside;
}
`;

/* =====================================================================
   Interaction simulation (ping-pong render targets, top-down field map)
   ===================================================================== */
const simType = THREE.HalfFloatType;
function makeRT(n) {
  return new THREE.WebGLRenderTarget(n, n, { type: simType, format: THREE.RGBAFormat, minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter, depthBuffer: false, stencilBuffer: false });
}
const sim = {
  disp: [makeRT(Q.simRes), makeRT(Q.simRes)],
  glow: [makeRT(Q.simRes), makeRT(Q.simRes)],
  i: 0,
};
const simCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
const simQuadGeo = new THREE.PlaneGeometry(2, 2);
const SIM_COMMON = /* glsl */`
uniform sampler2D uPrev; uniform vec4 uBounds; uniform vec2 uHandA, uHandB;
uniform float uActive, uRadius, uDt;
varying vec2 vUv;
float capsule(out vec2 dir){
  vec2 w = uBounds.xy + vUv * uBounds.zw;
  vec2 ab = uHandB - uHandA; float l2 = dot(ab, ab);
  float h = l2 > 1e-6 ? clamp(dot(w - uHandA, ab) / l2, 0.0, 1.0) : 0.0;
  vec2 dv = w - (uHandA + ab * h); float d = length(dv);
  dir = d > 1e-4 ? dv / d : vec2(0.0, 1.0);
  return d;
}`;
const simVert = /* glsl */`varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }`;
const simUniforms = {
  uPrev: { value: null }, uBounds: U.uSimBounds,
  uHandA: { value: new THREE.Vector2() }, uHandB: { value: new THREE.Vector2() },
  uActive: { value: 0 }, uRadius: { value: 1 }, uDt: { value: 1 / 60 },
};
const dispMat = new THREE.ShaderMaterial({
  uniforms: simUniforms, vertexShader: simVert,
  fragmentShader: SIM_COMMON + /* glsl */`
  void main(){
    vec4 s = texture2D(uPrev, vUv);
    vec2 d = s.xy, v = s.zw;
    vec2 dir; float dist = capsule(dir);
    float infl = uActive * (1.0 - smoothstep(uRadius * 0.2, uRadius, dist));
    vec2 target = dir * infl * 0.95;
    float k = mix(42.0, 95.0, infl);
    vec2 a = (target - d) * k - v * 5.2;
    v += a * uDt; d += v * uDt;
    gl_FragColor = vec4(d, v);
  }`,
  depthTest: false, depthWrite: false,
});
const glowMat = new THREE.ShaderMaterial({
  uniforms: simUniforms, vertexShader: simVert,
  fragmentShader: SIM_COMMON + /* glsl */`
  void main(){
    float g = texture2D(uPrev, vUv).r * exp(-uDt / 0.52);
    vec2 dir; float dist = capsule(dir);
    float inj = uActive * (1.0 - smoothstep(uRadius * 0.15, uRadius * 1.05, dist));
    gl_FragColor = vec4(max(g, inj), 0.0, 0.0, 1.0);
  }`,
  depthTest: false, depthWrite: false,
});
const simMesh = new THREE.Mesh(simQuadGeo, dispMat);
const simScene = new THREE.Scene();
simScene.add(simMesh);
// clear sim targets
for (const rt of [...sim.disp, ...sim.glow]) { renderer.setRenderTarget(rt); renderer.setClearColor(0x000000, 0); renderer.clear(); }
renderer.setRenderTarget(null);
renderer.setClearColor(0x120e22, 1);
U.uDisp.value = sim.disp[0].texture;
U.uGlowTex.value = sim.glow[0].texture;

function stepSim(dt) {
  const r = sim.i, w = 1 - sim.i;
  simUniforms.uDt.value = dt;
  simMesh.material = dispMat; simUniforms.uPrev.value = sim.disp[r].texture;
  renderer.setRenderTarget(sim.disp[w]); renderer.render(simScene, simCam);
  simMesh.material = glowMat; simUniforms.uPrev.value = sim.glow[r].texture;
  renderer.setRenderTarget(sim.glow[w]); renderer.render(simScene, simCam);
  renderer.setRenderTarget(null);
  sim.i = w;
  U.uDisp.value = sim.disp[w].texture;
  U.uGlowTex.value = sim.glow[w].texture;
}

/* =====================================================================
   Sky dome: gradient, moon/sun, painterly clouds, stars
   ===================================================================== */
const skyMat = new THREE.ShaderMaterial({
  uniforms: U,
  vertexShader: /* glsl */`
    varying vec3 vDir;
    void main(){ vDir = position; vec4 p = projectionMatrix * modelViewMatrix * vec4(position, 1.0); gl_Position = p.xyww; }`,
  fragmentShader: /* glsl */`
    ${GLSL_NOISE}
    ${GLSL_ATMOS}
    uniform vec3 uDisc, uHalo, uCloudLit, uCloudShadow;
    uniform float uDiscSize, uMoonness, uStars, uCloudOpacity, uCloudCover;
    varying vec3 vDir;
    vec3 stars(vec3 dir){
      vec3 p = dir * 210.0; vec3 cell = floor(p); vec3 f = fract(p);
      float h = hash13(cell);
      if (h < 0.955) return vec3(0.0);
      vec3 sp = vec3(hash13(cell + 1.3), hash13(cell + 2.7), hash13(cell + 4.1)) * 0.5 + 0.25;
      float d = length(f - sp);
      float big = smoothstep(0.993, 1.0, h);
      float b = smoothstep(0.16 + big * 0.12, 0.0, d);
      float tw = 0.55 + 0.45 * sin(uTime * (0.7 + h * 3.0) + h * 97.0);
      vec3 tint = mix(vec3(1.0, 0.92, 0.85), vec3(0.85, 0.9, 1.0), hash13(cell + 7.7));
      return tint * b * tw * (0.6 + big * 2.2);
    }
    vec4 clouds(vec3 dir, float ang){
      if (dir.y < 0.0) return vec4(0.0);
      vec2 uv = dir.xz / (dir.y + 0.11);
      uv *= 0.55;

    [-1.55, 7.25, 0.0, 2.25], [1.55, 7.2, 0.1, 2.3], [0.0, 6.2, 0.2, 2.55], [0.0, 5.0, 0.3, 1.75],

    [-0.75, 8.05, -0.3, 1.55], [0.85, 8.05, -0.2, 1.5], [0.0, 7.0, 1.1, 1.8], [0.0, 6.8, -1.2, 1.9],
  ];

      ${GLSL_NOISE}

    fragmentShader: /* glsl */`
      ${GLSL_NOISE}

      varying vec3 vWorld; varying vec3 vN; varying float vAO; varying vec3 vLocal;

canvas.addEventListener('touchmove', (e) => e.preventDefault(), { passive: false });

function updateHandEl(dt) {
  const vx = (HAND.x - HAND.lastX) / Math.max(dt, 1e-3); HAND.lastX = HAND.x;
  HAND.vx = lerp(HAND.vx, vx, 1 - Math.exp(-dt * 10));
  const targetTilt = clamp(HAND.vx * 0.012, -16, 16);
  HAND.tilt = lerp(HAND.tilt, targetTilt, 1 - Math.exp(-dt * 8));
  HAND.press = lerp(HAND.press, pointer.down ? 1 : 0, 1 - Math.exp(-dt * 14));
  const bob = Math.sin(performance.now() * 0.0025) * 1.2;
  const sc = 1 - HAND.press * 0.1;
  handEl.style.transform = `translate3d(${HAND.x - 29}px, ${HAND.y - 33 + bob}px, 0) rotate(${HAND.tilt}deg) scale(${sc})`;
  handEl.classList.toggle('visible', HAND.visible);
}

/* =====================================================================
   Pointer -> terrain ray march
   ===================================================================== */
const ray = new THREE.Vector3(), rp = new THREE.Vector3();
function surf(x, z, t) { return heightAt(x, z) + 0.42 * clamp(1.2 - t * 0.012, 0.6, 1.0); }
function raycastField(ndc, out) {
  ray.set(ndc.x, ndc.y, 0.5).unproject(camera).sub(camera.position).normalize();
  const o = camera.position;
  let t = 0.3, prevT = 0.3;
  for (let i = 0; i < 260 && t < 140; i++) {
    rp.copy(o).addScaledVector(ray, t);
    if (rp.y < surf(rp.x, rp.z, t)) {
      let lo = prevT, hi = t;
      for (let k = 0; k < 10; k++) {
        const m = (lo + hi) / 2; rp.copy(o).addScaledVector(ray, m);
        if (rp.y < surf(rp.x, rp.z, m)) hi = m; else lo = m;
      }
      out.copy(o).addScaledVector(ray, hi);
      return hi;
    }
    prevT = t; t += 0.04 + t * 0.018;
  }
  return -1;
}

/* =====================================================================
   Resize + adaptive quality
   ===================================================================== */
function resize() {
  const w = innerWidth, h = innerHeight;
  camera.aspect = w / h; camera.fov = fovFor(camera.aspect); camera.updateProjectionMatrix();
  renderer.setPixelRatio(pixelRatio);
  renderer.setSize(w, h, false);
  composer.setPixelRatio(pixelRatio);
  composer.setSize(w, h);
  finalPass.uniforms.uRes.value.set(w * pixelRatio, h * pixelRatio);
  U.uProjScale.value = (h * pixelRatio) / (2 * Math.tan(THREE.MathUtils.degToRad(camera.fov) / 2));
  if (viewHalfTan() * 1.1 > grassAspect * 1.04) fillGrass();
  moveIndicator();
}
let resizeT = 0;
addEventListener('resize', () => { clearTimeout(resizeT); resizeT = setTimeout(resize, 120); });
resize();

const QLEVELS = [
  { pr: Q.maxPR, density: 1.0 },
  { pr: Math.min(Q.maxPR, 1.5), density: 0.85 },
  { pr: Math.min(Q.maxPR, 1.25), density: 0.7 },
  { pr: 1.0, density: 0.58 },
  { pr: 0.85, density: 0.48 },
];
let qLevel = 0, perfAcc = 0, perfFrames = 0, perfWarm = 0;
function applyQuality(level) {
  qLevel = level;
  const L = QLEVELS[level];
  const dpr = window.devicePixelRatio || 1;
  pixelRatio = Math.min(dpr, L.pr);
  U.uDensity.value = L.density;
  U.uWidthComp.value = 1 / Math.pow(L.density, 0.35);
  resize();
}
if (params.has('q')) applyQuality(clamp(+params.get('q'), 0, QLEVELS.length - 1));
function monitorPerf(dt) {
  if (params.has('q')) return;
  perfWarm += dt;
  if (perfWarm < 2.0) return;                 // let shaders compile/settle
  perfAcc += dt; perfFrames++;
  if (perfAcc > 2.5) {
    const avg = perfAcc / perfFrames;
    if (avg > 1 / 50 && qLevel < QLEVELS.length - 1) applyQuality(qLevel + 1);
    perfAcc = 0; perfFrames = 0;
  }
}

/* =====================================================================
   Main loop
   ===================================================================== */
const clock = new THREE.Clock();
const hit = new THREE.Vector3(), prevHit = new THREE.Vector3();
let hadHit = false, handActive = 0, sparkleBudget = 0, simAcc = 0;
const SIM_DT = 1 / 120;
const tmp = new THREE.Vector3(), rayDir = new THREE.Vector3();

function updateFireflies(t, dt) {
  if (S.fireflies < 0.01) return;
  const hasHand = hadHit && pointer.active;
  if (hasHand) rayDir.set(pointer.ndc.x, pointer.ndc.y, 0.5).unproject(camera).sub(camera.position).normalize();
  const o = camera.position;
  for (let i = 0; i < FF; i++) {
    const i3 = i * 3, i4 = i * 4;
    const f = ff.freq;
    const hx = ff.home[i3] + Math.sin(t * f[i4] + f[i4 + 3]) * 1.4 + Math.sin(t * f[i4 + 2] * 2.3 + f[i4 + 3] * 2.0) * 0.5;
    const hy = ff.home[i3 + 1] + Math.sin(t * f[i4 + 1] * 1.7 + f[i4 + 3] * 3.0) * 0.35;
    const hz = ff.home[i3 + 2] + Math.cos(t * f[i4 + 2] + f[i4 + 3]) * 1.2;
    let px = hx + ff.off[i3], py = hy + ff.off[i3 + 1], pz = hz + ff.off[i3 + 2];
    let ax = -ff.off[i3] * 0.45, ay = -ff.off[i3 + 1] * 0.45, az = -ff.off[i3 + 2] * 0.45;
    if (hasHand) {
      tmp.set(px - o.x, py - o.y, pz - o.z);
      const along = tmp.dot(rayDir);
      if (along > 0) {
        tmp.addScaledVector(rayDir, -along);
        const dist = tmp.length();
        const R = 0.9 + along * 0.075;
        if (dist < R) {
          const k = (1 - dist / R); const s = k * k * 26 / Math.max(dist, 0.05);
          ax += tmp.x * s; ay += tmp.y * s * 0.6 + k * 3; az += tmp.z * s;
        }
      }
    }
    ff.vel[i3] = (ff.vel[i3] + ax * dt) * Math.exp(-dt * 1.6);
    ff.vel[i3 + 1] = (ff.vel[i3 + 1] + ay * dt) * Math.exp(-dt * 1.6);
    ff.vel[i3 + 2] = (ff.vel[i3 + 2] + az * dt) * Math.exp(-dt * 1.6);
    ff.off[i3] += ff.vel[i3] * dt; ff.off[i3 + 1] += ff.vel[i3 + 1] * dt; ff.off[i3 + 2] += ff.vel[i3 + 2] * dt;
    px = hx + ff.off[i3]; py = hy + ff.off[i3 + 1]; pz = hz + ff.off[i3 + 2];
    const g = heightAt(px, pz) + 0.2;
    if (py < g) { py = g; }
    ff.pos[i3] = px; ff.pos[i3 + 1] = py; ff.pos[i3 + 2] = pz;
  }
  ffGeo.attributes.position.needsUpdate = true;
}

function updateSparkles(dt, t) {
  const L = spLifeAttr.array;
  let any = false;
  for (let i = 0; i < SP; i++) {
    if (sp.life[i] <= 0) { L[i] = 0; continue; }
    any = true;
    sp.life[i] += dt / sp.max[i];
    if (sp.life[i] >= 1) { sp.life[i] = 0; L[i] = 0; continue; }
    const i3 = i * 3;
    sp.vel[i3] += Math.sin(t * 1.3 + sp.seed[i] * 30) * 0.25 * dt;
    sp.vel[i3 + 2] += Math.cos(t * 1.1 + sp.seed[i] * 20) * 0.25 * dt;
    sp.vel[i3 + 1] *= Math.exp(-dt * 0.5);
    sp.pos[i3] += sp.vel[i3] * dt; sp.pos[i3 + 1] += sp.vel[i3 + 1] * dt; sp.pos[i3 + 2] += sp.vel[i3 + 2] * dt;
    L[i] = sp.life[i];
  }
  if (any || sparkleBudget > 0) {
    spGeo.attributes.position.needsUpdate = true; spLifeAttr.needsUpdate = true;
    spGeo.attributes.aSize.needsUpdate = true; spGeo.attributes.aSeed.needsUpdate = true;
  }
}

function frame() {
  const dt = Math.min(clock.getDelta(), 1 / 20);
  const t = clock.elapsedTime;
  U.uTime.value = t;
  finalPass.uniforms.uTime.value = t;
  updateTransition(t);

  // camera breathing
  camera.position.set(
    CAM_BASE.x + Math.sin(t * 0.17) * 0.07 + Math.sin(t * 0.41) * 0.02,
    CAM_BASE.y + Math.sin(t * 0.23 + 1.0) * 0.045,
    CAM_BASE.z + Math.sin(t * 0.13 + 2.0) * 0.05);
  camera.lookAt(LOOK_BASE.x + Math.sin(t * 0.11) * 0.12, LOOK_BASE.y + Math.sin(t * 0.19 + 0.5) * 0.06, LOOK_BASE.z);
  camera.updateMatrixWorld();

  // hand -> field
  let dist = -1;
  if (pointer.active && !pointer.overUI) dist = raycastField(pointer.ndc, hit);
  const has = dist > 0;
  handActive = lerp(handActive, has ? 1 : 0, 1 - Math.exp(-dt * (has ? 14 : 6)));
  if (has && !hadHit) prevHit.copy(hit);
  const radius = 0.32 + (has ? dist : 10) * 0.058;
  simUniforms.uRadius.value = radius;
  simUniforms.uActive.value = handActive;
  if (has) {
    simUniforms.uHandA.value.set(prevHit.x, prevHit.z);
    simUniforms.uHandB.value.set(hit.x, hit.z);
    const moved = prevHit.distanceTo(hit);
    sparkleBudget += dt * (3 + Math.min(moved / Math.max(dt, 1e-3), 30) * 1.4 / (0.5 + dist * 0.04));
    while (sparkleBudget > 1) {
      sparkleBudget -= 1;
      tmp.lerpVectors(prevHit, hit, rand());
      spawnSparkle(tmp, radius * 0.7);
    }
  }
  simAcc += dt;
  let steps = 0;
  while (simAcc >= SIM_DT && steps < 6) { stepSim(SIM_DT); simAcc -= SIM_DT; steps++; simUniforms.uHandA.value.copy(simUniforms.uHandB.value); }
  if (steps === 6) simAcc = 0;
  if (has) prevHit.copy(hit);
  hadHit = has;

  updateFireflies(t, dt);
  fireflies.visible = S.fireflies > 0.005;
  updateSparkles(dt, t);
  updateHandEl(dt);

  composer.render(dt);
  monitorPerf(dt);
  requestAnimationFrame(frame);
}

document.addEventListener('visibilitychange', () => { clock.getDelta(); perfAcc = 0; perfFrames = 0; perfWarm = 0; });
if (params.get('preset') && P[params.get('preset')]) {
  Object.keys(S).forEach(k => { const v = P[params.get('preset')][k]; if (v && v.isColor) S[k].copy(v); else if (v && v.isVector3) S[k].copy(v); else S[k] = v; });
  syncScalars();
  document.querySelectorAll('.toggle button').forEach(b => b.classList.toggle('active', b.dataset.preset === params.get('preset')));
}
renderer.compile(scene, camera);
requestAnimationFrame(() => { document.getElementById('veil').classList.add('gone'); frame(); });
window.__meadow = { setPreset, pointer, HAND, U, camera, grass, grassMat, renderer, scene, sim, simUniforms };
</script>
</body>
</html>
